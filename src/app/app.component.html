<style>
  :host {
    --bright-blue: oklch(51.01% 0.274 263.83);
    --electric-violet: oklch(53.18% 0.28 296.97);
    --french-violet: oklch(47.66% 0.246 305.88);
    --vivid-pink: oklch(69.02% 0.277 332.77);
    --hot-red: oklch(61.42% 0.238 15.34);
    --orange-red: oklch(63.32% 0.24 31.68);

    --gray-900: oklch(19.37% 0.006 300.98);
    --gray-700: oklch(36.98% 0.014 302.71);
    --gray-400: oklch(70.9% 0.015 304.04);

    --red-to-pink-to-purple-vertical-gradient: linear-gradient(
      180deg,
      var(--orange-red) 0%,
      var(--vivid-pink) 50%,
      var(--electric-violet) 100%
    );

    --red-to-pink-to-purple-horizontal-gradient: linear-gradient(
      90deg,
      var(--orange-red) 0%,
      var(--vivid-pink) 50%,
      var(--electric-violet) 100%
    );

    --pill-accent: var(--bright-blue);

    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
      "Segoe UI Symbol";
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  h1 {
    font-size: 3.125rem;
    color: var(--gray-900);
    font-weight: 500;
    line-height: 100%;
    letter-spacing: -0.125rem;
    margin: 0;
    font-family: "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
      "Segoe UI Symbol";
  }

  p {
    margin: 0;
    color: var(--gray-700);
  }

  .container {
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    padding: 1rem;
    box-sizing: border-box;
  }

  .products {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 2rem;
  }

  .product-card {
    flex: 1 1 calc(33.333% - 1rem);
    max-width: calc(33.333% - 1rem);
    border: 1px solid var(--gray-400);
    border-radius: 0.5rem;
    padding: 1rem;
    text-align: center;
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .product-card.selected {
    transform: scale(1.05);
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
  }

  .product-card img {
    max-width: 100%;
    height: auto;
    border-radius: 0.5rem;
    margin-bottom: 0.5rem;
  }

  .checkout-panel {
    border: 1px solid var(--gray-400);
    border-radius: 0.5rem;
    padding: 1rem;
    text-align: center;
  }

  .checkout-panel div {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }

  .checkout-panel button {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 0.5rem;
    background-color: var(--bright-blue);
    color: white;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .checkout-panel button:disabled {
    background-color: var(--gray-400);
    cursor: not-allowed;
  }

  .checkout-panel .error {
    color: var(--hot-red);
    margin-top: 1rem;
  }
</style>

<div class="container">
  <h1>{{ title }}</h1>
  <div class="products">
    <div
      class="product-card"
      *ngFor="let product of products"
      [class.selected]="product === selectedProduct"
      (click)="selectProduct(product)"
    >
      <img [src]="product.image" [alt]="product.name" />
      <h2>{{ product.name }}</h2>
      <p>Price: ${{ (product.price / 100) | number:'1.2-2' }}</p>
    </div>
  </div>

  <div class="checkout-panel" *ngIf="selectedProduct">
    <h3>Selected: {{ selectedProduct.name }}</h3>
    <div>
      <button (click)="quantity = quantity > 1 ? quantity - 1 : 1">-</button>
      <span>{{ quantity }}</span>
      <button (click)="quantity = quantity + 1">+</button>
    </div>
    <p>Total: ${{ (selectedProduct.price * quantity / 100) | number:'1.2-2' }}</p>
    <button (click)="checkout()" [disabled]="loading">
      {{ loading ? 'Processing...' : 'Pay with Stripe' }}
    </button>
    <div *ngIf="error" class="error">{{ error }}</div>
  </div>
</div>

<router-outlet />
