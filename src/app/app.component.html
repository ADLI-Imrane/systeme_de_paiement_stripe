<style>
  :host {
    --primary: #3a86ff;
    --danger: #ff006e;
    --bg: #f8f9fa;
    --card-bg: #fff;
    --border: #e0e0e0;
    --shadow: 0 2px 16px rgba(0,0,0,0.06);
    --radius: 1rem;
    --gray: #6c757d;
    --transition: 0.2s cubic-bezier(.4,0,.2,1);
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    min-height: 100vh;
  }
  .container {
    max-width: 1100px;
    margin: 2rem auto 0 auto;
    padding: 2rem 1.5rem 1.5rem 1.5rem;
    background: #fff;
    border-radius: 1.5rem;
    box-shadow: 0 2px 24px rgba(0,0,0,0.07);
    border: 1px solid #ececec;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2rem;
  }
  .title {
    font-size: 2.5rem;
    font-weight: 700;
    color: #222;
    letter-spacing: -1px;
  }
  .cart-btn {
    position: fixed;
    top: 2rem;
    right: 2rem;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 48px;
    height: 48px;
    font-size: 1.7rem;
    cursor: pointer;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background var(--transition);
  }
  .cart-btn:hover {
    background: #265ecf;
  }
  .cart-count {
    position: absolute;
    top: 2px;
    right: 2px;
    background: var(--danger);
    color: #fff;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
  }
  .products {
    display: grid;
    grid-template-columns: repeat(4, 0fr);
    gap: 1rem;
  }
  .product-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: stretch;
    overflow: hidden;
    transition: box-shadow var(--transition), transform var(--transition);
    height: 250px;
  }
  .product-img {
    width: 100%;
    height: 140px;
    object-fit: contain;
    background: #f3f3f3;
    border-bottom: 1px solid var(--border);
    display: block;
  }
  .product-info {
    height: 120px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 0.7rem 0.7rem 0.7rem 0.7rem;
  }
  .product-name {
    font-size: 1.1rem;
    font-weight: 600;
    color: #222;
    margin-bottom: 0.3rem;
    min-height: 2.6em;
    line-height: 1.3em;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: normal;
  }
  .product-price {
    color: var(--primary);
    font-size: 1rem;
    font-weight: 500;
    margin-bottom: 0.7rem;
  }
  .product-card button {
    padding: 0.4rem 1rem;
    border: none;
    border-radius: 0.5rem;
    background: var(--primary);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
    transition: background var(--transition);
    margin-top: 0.5rem;
  }
  .product-card button:hover {
    background: #265ecf;
  }
  .offcanvas-cart {
    position: fixed;
    top: 0;
    right: 0;
    width: 370px;
    max-width: 100vw;
    height: 100vh;
    background: #fff;
    box-shadow: -2px 0 24px rgba(0,0,0,0.13);
    z-index: 2000;
    transform: translateX(100%);
    transition: transform 0.3s;
    display: flex;
    flex-direction: column;
    padding: 2rem 1.5rem 1.5rem 1.5rem;
    overflow-y: auto;
  }
  .offcanvas-cart.open {
    transform: translateX(0);
  }
  .offcanvas-cart .close-btn {
    align-self: flex-end;
    background: none;
    border: none;
    font-size: 2.2rem;
    color: var(--gray);
    cursor: pointer;
    margin-bottom: 1rem;
    transition: color var(--transition);
  }
  .offcanvas-cart .close-btn:hover {
    color: var(--danger);
  }
  .offcanvas-cart h3 {
    margin-top: 0;
    margin-bottom: 1.5rem;
    font-size: 1.3rem;
    font-weight: 700;
    color: #222;
  }
  .offcanvas-cart .cart-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.7rem;
    gap: 0.2rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.5rem;
    font-size: 0.97rem;
    flex-wrap: wrap;
  }
  .offcanvas-cart .cart-item span,
  .offcanvas-cart .cart-item button {
    margin: 0 0.1rem;
  }
  .offcanvas-cart .cart-item .cart-product-name {
    flex: 1 1 90px;
    text-align: left;
    font-weight: 500;
    color: #222;
    min-width: 70px;
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .offcanvas-cart .cart-item button {
    padding: 0.2rem 0.5rem;
    font-size: 0.97rem;
    border-radius: 0.4rem;
  }
  .offcanvas-cart .cart-item button:last-child {
    margin-left: 0.2rem;
  }
  .offcanvas-cart .cart-footer {
    position: sticky;
    bottom: 0;
    background: #fff;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    text-align: center;
    z-index: 10;
  }
  .offcanvas-cart .cart-footer p {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 0.7rem;
  }
  .offcanvas-cart .checkout-btn {
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    padding: 0.7rem 0;
    font-size: 1rem;
    margin-bottom: 0.2rem;
    white-space: normal;
  }
  .offcanvas-cart .checkout-btn:disabled {
    background: var(--gray);
    cursor: not-allowed;
  }
  .offcanvas-cart .checkout-btn:hover:not(:disabled) {
    background: #265ecf;
  }
  .offcanvas-cart .error {
    color: var(--danger);
    margin-top: 1rem;
    font-size: 1rem;
  }
  @media (max-width: 1200px) {
    .container {
      max-width: 900px;
    }
    .products {
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }
  }
  @media (max-width: 700px) {
    .container {
      max-width: 100vw;
      border-radius: 0;
      padding: 0.5rem;
    }
    .products {
      grid-template-columns: repeat(2, 0fr);
      gap: 0.7rem;
    }
    .offcanvas-cart {
      width: 100vw;
      left: 0;
      right: 0;
      max-width: 100vw;
      border-radius: 0;
      padding: 1rem 0.5rem 1.5rem 0.5rem;
      overflow-y: auto;
    }
    .cart-overlay {
      width: 100vw;
      left: 0;
      right: 0;
    }
    .offcanvas-cart .checkout-btn {
      width: 100%;
      max-width: 100%;
      font-size: 1rem;
      padding: 0.7rem 0;
      margin-bottom: 0.2rem;
    }
    .offcanvas-cart .cart-item {
      flex-wrap: wrap;
      gap: 0.3rem;
    }
    .offcanvas-cart .cart-item .cart-product-name {
      max-width: 100%;
      min-width: 50px;
      white-space: normal;
      overflow: visible;
      text-overflow: initial;
    }
  }
  .cart-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0,0,0,0.18);
    z-index: 1999;
    transition: opacity 0.2s;
  }
</style>

<div class="container">
  <div class="header">
    <span class="title">{{ title }}</span>
    <button class="cart-btn" (click)="openCart()">
      🛒
      <span class="cart-count" *ngIf="cart.length > 0">{{ cart.length }}</span>
    </button>
  </div>
  <div class="products">
    <div class="product-card" *ngFor="let product of products">
      <img class="product-img" [src]="product.image" [alt]="product.name" />
      <div class="product-info">
        <div>
          <div class="product-name">{{ product.name }}</div>
          <div class="product-price">${{ (product.price / 100) | number:'1.2-2' }}</div>
        </div>
        <button (click)="addToCart(product)">Add to Cart</button>
      </div>
    </div>
  </div>
</div>

<div *ngIf="showCart" class="cart-overlay" (click)="closeCart()"></div>
<div class="offcanvas-cart" [class.open]="showCart">
  <button class="close-btn" (click)="closeCart()">&times;</button>
  <h3>Your Cart</h3>
  <div *ngIf="cart.length === 0">Your cart is empty.</div>
  <div *ngFor="let item of cart" class="cart-item">
    <span class="cart-product-name">{{ item.name }}</span>
    <button (click)="updateQuantity(item, -1)">-</button>
    <span>{{ item.quantity }}</span>
    <button (click)="updateQuantity(item, 1)">+</button>
    <span>${{ (item.price / 100) | number:'1.2-2' }}</span>
    <button (click)="removeFromCart(item)">Remove</button>
  </div>
  <div class="cart-footer" *ngIf="cart.length > 0">
    <p>Total: ${{ (getCartTotal() / 100) | number:'1.2-2' }}</p>
    <button class="checkout-btn" (click)="checkout()" [disabled]="loading || cart.length === 0">
      {{ loading ? 'Processing...' : 'Pay with Stripe' }}
    </button>
    <div *ngIf="error" class="error">{{ error }}</div>
  </div>
</div>

<router-outlet />
